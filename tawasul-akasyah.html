<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f7a4f">
<title>Tawasul Akasyah — Arab, Latin, dan Terjemahan</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Segoe+UI&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1a1a;
    --card:#152524;
    --card-border:#25423f;
    --gold:#c9a24b;
    --gold-soft:#e9d9a8;
    --text:#eef2ef;
    --muted:#9fb3ae;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: radial-gradient(circle at top, #1b302d 0%, #0f1a1a 60%);
    color:var(--text);
    padding-bottom:60px;
  }
  header{
    text-align:center;
    padding:40px 20px 25px;
    border-bottom:1px solid var(--card-border);
  }
  header h1{
    margin:0;
    font-size:1.8rem;
    color:var(--gold-soft);
    letter-spacing:0.5px;
  }
  header p{
    margin:8px 0 0;
    color:var(--muted);
    font-size:0.95rem;
  }
  .container{
    max-width:820px;
    margin:0 auto;
    padding:20px 16px;
  }
  .back-home{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:var(--gold-soft);
    text-decoration:none;
    font-size:0.85rem;
    padding:8px 14px;
    border:1px solid var(--card-border);
    border-radius:20px;
    transition:0.2s;
  }
  .back-home:hover{
    border-color:var(--gold);
    background:rgba(201,162,75,0.08);
  }
  .back-home-wrap{
    display:flex;
    justify-content:center;
    padding:14px 16px 0;
  }
  .intro{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:26px;
    font-size:0.93rem;
    line-height:1.6;
    color:var(--muted);
  }
  .intro b{color:var(--gold-soft);}
  .page-indicator{
    text-align:center;
    color:var(--muted);
    font-size:0.8rem;
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .page-indicator b{color:var(--gold-soft);}
  .segment{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:26px 22px 18px;
    margin-bottom:20px;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
    min-height:220px;
  }
  .segment .no{
    font-size:0.72rem;
    color:var(--gold);
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .nav-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:8px;
  }
  .nav-btn{
    display:flex;
    align-items:center;
    gap:6px;
    background:transparent;
    border:1px solid var(--gold);
    color:var(--gold-soft);
    padding:10px 16px;
    border-radius:10px;
    font-size:0.85rem;
    cursor:pointer;
    transition:0.2s;
  }
  .nav-btn:hover:not(:disabled){
    background:var(--gold);
    color:#1a1a1a;
  }
  .nav-btn:disabled{
    opacity:0.35;
    cursor:not-allowed;
  }
  .jump-wrap{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--muted);
    font-size:0.8rem;
  }
  .jump-wrap select{
    background:var(--card);
    color:var(--text);
    border:1px solid var(--card-border);
    border-radius:8px;
    padding:6px 8px;
    font-size:0.8rem;
  }
  .dots{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:center;
    margin:18px 0 4px;
  }
  .dots span{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--card-border);
    cursor:pointer;
    transition:0.2s;
  }
  .dots span.active{
    background:var(--gold);
    width:22px;
    border-radius:5px;
  }
  .arabic{
    font-family:'Amiri', serif;
    font-size:1.9rem;
    line-height:2.6;
    direction:rtl;
    text-align:right;
    color:var(--gold-soft);
    margin:0 0 14px;
  }
  .toggle-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:none;
    border:1px solid var(--card-border);
    color:var(--muted);
    padding:7px 14px;
    border-radius:20px;
    font-size:0.8rem;
    cursor:pointer;
    transition:0.2s;
  }
  .toggle-btn:hover{
    border-color:var(--gold);
    color:var(--gold-soft);
  }
  .toggle-btn .arrow{
    transition:transform 0.25s;
    display:inline-block;
  }
  .toggle-btn.open .arrow{
    transform:rotate(180deg);
  }
  .details{
    max-height:0;
    overflow:hidden;
    transition:max-height 0.35s ease;
  }
  .details.open{
    max-height:900px;
  }
  .details-inner{
    padding-top:16px;
    border-top:1px dashed var(--card-border);
    margin-top:14px;
  }
  .latin{
    font-style:italic;
    color:#cfe3df;
    font-size:0.95rem;
    line-height:1.65;
    margin:0 0 12px;
  }
  .latin .label, .terjemahan .label{
    display:block;
    font-style:normal;
    font-size:0.7rem;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:4px;
  }
  .terjemahan{
    color:var(--muted);
    font-size:0.92rem;
    line-height:1.65;
    margin:0;
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:0.8rem;
    margin-top:30px;
    padding:0 20px;
    line-height:1.6;
  }
  footer a{color:var(--gold-soft);}
</style>
</head>
<body>

<header>
  <h1>✨ Tawasul Akasyah ✨</h1>
  <p>Arab, Latin, dan Terjemahan</p>
</header>

<div class="back-home-wrap">
  <a class="back-home" href="index.html">&larr; Kembali ke Beranda</a>
</div>

<div class="container">

  <div class="page-indicator">Bacaan <b id="pageNum">1</b> dari <b id="pageTotal">1</b></div>

  <div id="segments"></div>

  <div class="nav-bar">
    <button class="nav-btn" id="prevBtn" onclick="goPage(currentPage-1)">‹ Sebelumnya</button>
    <div class="jump-wrap">
      Ke bacaan
      <select id="jumpSelect" onchange="goPage(parseInt(this.value))"></select>
    </div>
    <button class="nav-btn" id="nextBtn" onclick="goPage(currentPage+1)">Berikutnya ›</button>
  </div>

  <div class="dots" id="dots"></div>

  <footer>
    Sentuh tombol "Latin &amp; Terjemahan" untuk menampilkan atau menyembunyikannya.
  </footer>
</div>

<script>
const tawasul = [
{
  arabic: "بِالنِّيَّةِ لِرِضَاءِ اللهِ تَعَالَى الْفَاتِحَة",
  latin: "Bin niyyati li ridhā'illāhi ta'ālā, al-Fātihah.",
  terjemahan: "Dengan niat karena ridha Allah Ta'ala, (bacalah) Al-Fatihah."
},
{
  arabic: "إِلَى حَضْرَةِ النَّبِيِّ الْمُصْطَفَى مُحَمَّدٍ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ الْفَاتِحَة",
  latin: "Ilā hadhratin Nabiyyil Mushthafā Muhammadin shallallāhu 'alayhi wa sallam, al-Fātihah.",
  terjemahan: "Kepada hadirat Nabi pilihan, Muhammad SAW, (bacalah) Al-Fatihah."
},
{
  arabic: "إِلَى حَضْرَةِ وَالِدَيَّ الْفَاتِحَة",
  latin: "Ilā hadhrati wālidayya, al-Fātihah.",
  terjemahan: "Kepada hadirat kedua orang tuaku, (bacalah) Al-Fatihah."
},
{
  arabic: "إِلَى حَضْرَةِ سُلْطَانِ الْأَوْلِيَاءِ وَالْإِمَامِ الْعُلَمَاءِ سَيِّدِنَا الشَّيْخ عَبْدِ الْقَادِرِ الْجَيْلَانِيِّ رَضِيَ اللهُ عَنْهُ الْفَاتِحَة",
  latin: "Ilā hadhrati sulthānil awliyā'i wal imāmil 'ulamā'i sayyidinasy Syaikh 'Abdil Qādiril Jailānī radhiyallāhu 'anhu, al-Fātihah.",
  terjemahan: "Kepada hadirat raja para wali dan imam para ulama, junjungan kita Syekh Abdul Qadir Al-Jailani RA, (bacalah) Al-Fatihah."
},
{
  arabic: "إِلَى حَضْرَةِ جَمِيعِ الْأَنْبِيَاءِ وَالْمُرْسَلِينَ خُصُوصًا سَيِّدِنَا خِضِرْ عَلَيْهِ السَّلَام الْفَاتِحَة",
  latin: "Ilā hadhrati jamī'il anbiyā'i wal mursalīn, khushūshan sayyidinā Khidhir 'alayhis salām, al-Fātihah.",
  terjemahan: "Kepada hadirat seluruh para nabi dan rasul, khususnya junjungan kita Nabi Khidir AS, (bacalah) Al-Fatihah."
},
{
  arabic: "إِلَى حَضْرَةِ جَمِيعِ مَلَائِكَةِ اللهِ جِبْرِيلَ وَمِيكَائِيلَ وَإِسْرَافِيلَ وَعِزْرَائِيلَ عَلَيْهِمُ السَّلَام الْفَاتِحَة",
  latin: "Ilā hadhrati jamī'i malā'ikatillāhi Jibrīla wa Mīkā'īla wa Isrāfīla wa 'Izrā'īla 'alayhimus salām, al-Fātihah.",
  terjemahan: "Kepada hadirat seluruh malaikat Allah; Jibril, Mikail, Israfil, dan Izrail 'alaihimus salam, (bacalah) Al-Fatihah."
},
{
  arabic: "إِلَى حَضْرَةِ مَلَائِكَةِ الرُّوحَانِيِّينَ وَالْكَرُوبِيِّينَ وَالْمُقَرَّبِينَ لَهُمُ الْفَاتِحَة",
  latin: "Ilā hadhrati malā'ikatir rūhāniyyīna wal karūbiyyīna wal muqarrabīna, lahumul Fātihah.",
  terjemahan: "Kepada hadirat para malaikat ruhaniyyin, karubiyyin, dan muqarrabin, bagi mereka (bacalah) Al-Fatihah."
},
{
  arabic: "إِلَى حَضْرَةِ جَمِيعِ الصَّحَابَةِ رَسُولِ اللهِ خُصُوصًا سَيِّدِنَا عُكَاشَة رَضِيَ اللهُ عَنْهُ الْفَاتِحَة",
  latin: "Ilā hadhrati jamī'i shahābati Rasūlillāh, khushūshan sayyidinā 'Ukāsyah radhiyallāhu 'anhu, al-Fātihah.",
  terjemahan: "Kepada hadirat seluruh sahabat Rasulullah, khususnya junjungan kita Ukasyah RA, (bacalah) Al-Fatihah."
},
{
  arabic: "إِلَى حَضْرَةِ مْبَاهْ عَبْدِ الْجَلِيلِ مَنْتِڠَانْ وَسُلْطَانْ هَادِلِرِينْ مَنْتِڠَانْ وَرَاتُو كَالِينْيَامَتْ مَنْتِڠَانْ وَمْبَاهْ جُومِينَهَانْ مَنْتِڠَانْ وَمْبَاهْ چِيتْرَاسُومُو الْأَوَّل سيندڠ كَالِينْيَامَاتَانْ وَمْبَاهْ وِيرَا وِڠُونُو سُونَانْ بَاڠُوسَانْ كَارَڠْ كَبَاڠُوسَانْ وَمْبَاهْ إِيلَادُونِي كَارَڠْ كَبَاڠُوسَانْ الْفَاتِحَة",
  latin: "Ilā hadhrati Mbah 'Abdul Jalīl Mantingan, Sulthān Hadlirin Mantingan, Ratu Kalinyamat Mantingan, Mbah Juminahan Mantingan, Mbah Citrosomo I Sendang Kalinyamatan, Mbah Wiro Wiguno Sunan Bagusan Karang Kebagusan, wa Mbah Iladuni Karang Kebagusan, al-Fātihah.",
  terjemahan: "Kepada hadirat Mbah Abdul Jalil Mantingan, Sultan Hadlirin Mantingan, Ratu Kalinyamat Mantingan, Mbah Juminahan Mantingan, Mbah Citrosomo I Sendang Kalinyamatan, Mbah Wiro Wiguno Sunan Bagusan Karang Kebagusan, dan Mbah Iladuni Karang Kebagusan, (bacalah) Al-Fatihah."
},
{
  arabic: "إِلَى حَضْرَةِ جَمِيعِ الْأَسَاتِذِ وَجَمِيعِ مَنْ أَجَازَنِي الْفَاتِحَة",
  latin: "Ilā hadhrati jamī'il asātidzi wa jamī'i man ajāzanī, al-Fātihah.",
  terjemahan: "Kepada hadirat seluruh guruku dan semua yang telah memberiku ijazah, (bacalah) Al-Fatihah."
},
{
  arabic: "إِلَى حَضْرَةِ جَمِيعِ الْمُسْلِمِينَ وَالْمُسْلِمَاتِ وَالْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ لَهُمُ الْفَاتِحَة",
  latin: "Ilā hadhrati jamī'il muslimīna wal muslimāti wal mu'minīna wal mu'mināti, lahumul Fātihah.",
  terjemahan: "Kepada hadirat seluruh kaum muslimin dan muslimat, mukminin dan mukminat, bagi mereka (bacalah) Al-Fatihah."
},
{
  arabic: "وَخُصُوصًا إِلَى نَفْسِي الْفَاتِحَة",
  latin: "Wa khushūshan ilā nafsī, al-Fātihah.",
  terjemahan: "Dan khususnya untuk diriku sendiri, (bacalah) Al-Fatihah."
}
];

const container = document.getElementById('segments');
const dotsWrap = document.getElementById('dots');
const jumpSelect = document.getElementById('jumpSelect');
const pageNumEl = document.getElementById('pageNum');
const pageTotalEl = document.getElementById('pageTotal');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

let currentPage = 0;
const total = tawasul.length;

pageTotalEl.textContent = total;

// isi dropdown lompat halaman
tawasul.forEach((item, idx) => {
  const opt = document.createElement('option');
  opt.value = idx;
  opt.textContent = `Bacaan ${idx + 1}`;
  jumpSelect.appendChild(opt);
});

// isi titik navigasi
tawasul.forEach((item, idx) => {
  const dot = document.createElement('span');
  dot.onclick = () => goPage(idx);
  dotsWrap.appendChild(dot);
});

function renderPage(idx){
  const item = tawasul[idx];
  container.innerHTML = `
    <div class="segment">
      <div class="no">Bacaan ${idx + 1}</div>
      <p class="arabic">${item.arabic}</p>
      <button class="toggle-btn" onclick="toggleDetail(this)">
        <span class="arrow">▾</span> Latin &amp; Terjemahan
      </button>
      <div class="details">
        <div class="details-inner">
          <p class="latin"><span class="label">Latin</span>${item.latin}</p>
          <p class="terjemahan"><span class="label">Terjemahan</span>${item.terjemahan}</p>
        </div>
      </div>
    </div>
  `;
  pageNumEl.textContent = idx + 1;
  jumpSelect.value = idx;
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === total - 1;
  [...dotsWrap.children].forEach((d, i) => d.classList.toggle('active', i === idx));
  window.scrollTo({top:0, behavior:'smooth'});
}

function goPage(idx){
  if(idx < 0 || idx >= total) return;
  currentPage = idx;
  renderPage(currentPage);
}

function toggleDetail(btn){
  const details = btn.nextElementSibling;
  const isOpen = details.classList.toggle('open');
  btn.classList.toggle('open', isOpen);
}

// navigasi keyboard (panah kiri/kanan)
document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowRight') goPage(currentPage + 1);
  if(e.key === 'ArrowLeft') goPage(currentPage - 1);
});

renderPage(currentPage);
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js");
  });
}
</script>
</body>
</html>
