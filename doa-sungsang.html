<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f7a4f">
<title>Doa Sungsang — Arab, Latin, dan Terjemahan</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Segoe+UI&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1a1a;
    --card:#152524;
    --card-border:#25423f;
    --gold:#c9a24b;
    --gold-soft:#e9d9a8;
    --text:#eef2ef;
    --muted:#9fb3ae;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: radial-gradient(circle at top, #1b302d 0%, #0f1a1a 60%);
    color:var(--text);
    padding-bottom:60px;
  }
  header{
    text-align:center;
    padding:40px 20px 25px;
    border-bottom:1px solid var(--card-border);
  }
  header h1{
    margin:0;
    font-size:1.8rem;
    color:var(--gold-soft);
    letter-spacing:0.5px;
  }
  header p{
    margin:8px 0 0;
    color:var(--muted);
    font-size:0.95rem;
  }
  .container{
    max-width:820px;
    margin:0 auto;
    padding:20px 16px;
  }
  .back-home{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:var(--gold-soft);
    text-decoration:none;
    font-size:0.85rem;
    padding:8px 14px;
    border:1px solid var(--card-border);
    border-radius:20px;
    transition:0.2s;
  }
  .back-home:hover{
    border-color:var(--gold);
    background:rgba(201,162,75,0.08);
  }
  .back-home-wrap{
    display:flex;
    justify-content:center;
    padding:14px 16px 0;
  }
  .intro{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:26px;
    font-size:0.93rem;
    line-height:1.6;
    color:var(--muted);
  }
  .intro b{color:var(--gold-soft);}
  .page-indicator{
    text-align:center;
    color:var(--muted);
    font-size:0.8rem;
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .page-indicator b{color:var(--gold-soft);}
  .segment{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:26px 22px 18px;
    margin-bottom:20px;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
    min-height:220px;
  }
  .segment .no{
    font-size:0.72rem;
    color:var(--gold);
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .nav-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:8px;
  }
  .nav-btn{
    display:flex;
    align-items:center;
    gap:6px;
    background:transparent;
    border:1px solid var(--gold);
    color:var(--gold-soft);
    padding:10px 16px;
    border-radius:10px;
    font-size:0.85rem;
    cursor:pointer;
    transition:0.2s;
  }
  .nav-btn:hover:not(:disabled){
    background:var(--gold);
    color:#1a1a1a;
  }
  .nav-btn:disabled{
    opacity:0.35;
    cursor:not-allowed;
  }
  .jump-wrap{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--muted);
    font-size:0.8rem;
  }
  .jump-wrap select{
    background:var(--card);
    color:var(--text);
    border:1px solid var(--card-border);
    border-radius:8px;
    padding:6px 8px;
    font-size:0.8rem;
  }
  .dots{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:center;
    margin:18px 0 4px;
  }
  .dots span{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--card-border);
    cursor:pointer;
    transition:0.2s;
  }
  .dots span.active{
    background:var(--gold);
    width:22px;
    border-radius:5px;
  }
  .arabic{
    font-family:'Amiri', serif;
    font-size:1.9rem;
    line-height:2.6;
    direction:rtl;
    text-align:right;
    color:var(--gold-soft);
    margin:0 0 14px;
  }
  .toggle-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:none;
    border:1px solid var(--card-border);
    color:var(--muted);
    padding:7px 14px;
    border-radius:20px;
    font-size:0.8rem;
    cursor:pointer;
    transition:0.2s;
  }
  .toggle-btn:hover{
    border-color:var(--gold);
    color:var(--gold-soft);
  }
  .toggle-btn .arrow{
    transition:transform 0.25s;
    display:inline-block;
  }
  .toggle-btn.open .arrow{
    transform:rotate(180deg);
  }
  .details{
    max-height:0;
    overflow:hidden;
    transition:max-height 0.35s ease;
  }
  .details.open{
    max-height:900px;
  }
  .details-inner{
    padding-top:16px;
    border-top:1px dashed var(--card-border);
    margin-top:14px;
  }
  .latin{
    font-style:italic;
    color:#cfe3df;
    font-size:0.95rem;
    line-height:1.65;
    margin:0 0 12px;
  }
  .latin .label, .terjemahan .label{
    display:block;
    font-style:normal;
    font-size:0.7rem;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:4px;
  }
  .terjemahan{
    color:var(--muted);
    font-size:0.92rem;
    line-height:1.65;
    margin:0;
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:0.8rem;
    margin-top:30px;
    padding:0 20px;
    line-height:1.6;
  }
  footer a{color:var(--gold-soft);}
</style>
</head>
<body>

<header>
  <h1>✨ Doa Sungsang ✨</h1>
  <p>Arab, Latin, dan Terjemahan</p>
</header>

<div class="back-home-wrap">
  <a class="back-home" href="index.html">&larr; Kembali ke Beranda</a>
</div>

<div class="container">

  <div class="page-indicator">Bacaan <b id="pageNum">1</b> dari <b id="pageTotal">1</b></div>

  <div id="segments"></div>

  <div class="nav-bar">
    <button class="nav-btn" id="prevBtn" onclick="goPage(currentPage-1)">‹ Sebelumnya</button>
    <div class="jump-wrap">
      Ke bacaan
      <select id="jumpSelect" onchange="goPage(parseInt(this.value))"></select>
    </div>
    <button class="nav-btn" id="nextBtn" onclick="goPage(currentPage+1)">Berikutnya ›</button>
  </div>

  <div class="dots" id="dots"></div>

  <footer>
    Sentuh tombol "Latin &amp; Terjemahan" untuk menampilkan atau menyembunyikannya.
  </footer>
</div>

<script>
const doa = [
{
  arabic: "يَا غَنِيُّ يَا حَمِيْدُ، يَا اَللهُ كُنْ فَيَكُوْنُ بِقُدْرَتِهِ وَصِفَاتِهِ، بِنُوْرِ الِاسْمِ غَالِبَةً نُوْرَ الْقَدِيْمِ، يَا أَحَدُ يَا صَمَدُ جَلَّ جَلَالُهُ، أَنْتَ السَّلَامُ يَا اللهُ يَا اللهُ يَا اللهُ وَبِالسَّلَامِ يَا مُحَمَّدُ يَا مُحَمَّدُ، وَكَيْفِيَّتُهُ ذُو الْجَلَالِ وَالْإِكْرَامِ.",
  latin: "Yā Ghaniyyu yā Hamīd, yā Allāhu kun fayakūnu bi qudratihī wa shifātih. Bi nūril ismi ghālibatan nūral qadīm. Yā Ahadu yā Shamadu jalla jalāluh. Antas Salāmu yā Allāhu yā Allāhu ya Allāhu wa bis salāmi yā Muhammad ya Muhammad. Wa kayfiyyatuhū Dzul Jalāli wal Ikrām.",
  terjemahan: "Wahai Zat Yang Maha Kaya, wahai Zat Yang Maha Terpuji, wahai Allah, 'Jadilah', maka jadilah, dengan kodrat dan sifat-Nya. Dengan cahaya asma yang mengungguli cahaya yang azali (dahulu, tiada berpermulaan). Wahai Zat Yang Maha Esa, wahai Zat tempat bergantung, Maha Agung keagungan-Nya. Engkaulah As-Salam (sumber keselamatan), wahai Allah, wahai Allah, wahai Allah, dan dengan keselamatan itu, wahai Muhammad, wahai Muhammad. Dan keadaannya kembali kepada Zat pemilik keagungan dan kemuliaan."
}
];

const container = document.getElementById('segments');
const dotsWrap = document.getElementById('dots');
const jumpSelect = document.getElementById('jumpSelect');
const pageNumEl = document.getElementById('pageNum');
const pageTotalEl = document.getElementById('pageTotal');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

let currentPage = 0;
const total = doa.length;

pageTotalEl.textContent = total;

// isi dropdown lompat halaman
doa.forEach((item, idx) => {
  const opt = document.createElement('option');
  opt.value = idx;
  opt.textContent = `Bacaan ${idx + 1}`;
  jumpSelect.appendChild(opt);
});

// isi titik navigasi
doa.forEach((item, idx) => {
  const dot = document.createElement('span');
  dot.onclick = () => goPage(idx);
  dotsWrap.appendChild(dot);
});

function renderPage(idx){
  const item = doa[idx];
  container.innerHTML = `
    <div class="segment">
      <div class="no">Bacaan ${idx + 1}</div>
      <p class="arabic">${item.arabic}</p>
      <button class="toggle-btn" onclick="toggleDetail(this)">
        <span class="arrow">▾</span> Latin &amp; Terjemahan
      </button>
      <div class="details">
        <div class="details-inner">
          <p class="latin"><span class="label">Latin</span>${item.latin}</p>
          <p class="terjemahan"><span class="label">Terjemahan</span>${item.terjemahan}</p>
        </div>
      </div>
    </div>
  `;
  pageNumEl.textContent = idx + 1;
  jumpSelect.value = idx;
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === total - 1;
  [...dotsWrap.children].forEach((d, i) => d.classList.toggle('active', i === idx));
  window.scrollTo({top:0, behavior:'smooth'});
}

function goPage(idx){
  if(idx < 0 || idx >= total) return;
  currentPage = idx;
  renderPage(currentPage);
}

function toggleDetail(btn){
  const details = btn.nextElementSibling;
  const isOpen = details.classList.toggle('open');
  btn.classList.toggle('open', isOpen);
}

// navigasi keyboard (panah kiri/kanan)
document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowRight') goPage(currentPage + 1);
  if(e.key === 'ArrowLeft') goPage(currentPage - 1);
});

renderPage(currentPage);
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js");
  });
}
</script>
</body>
</html>
